[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-agent"
version = "0.1.0"
description = "Your project description"
readme = "README.md"
authors = [
    {name = "sushovong", email = "sushovon.ghosh@udaan.com"}
]
requires-python = ">=3.8"
dependencies = [
    "azure-kusto-data>=5.0.4",
    "cryptography>=1.3.4",
    "dotenv>=0.9.9",
    "flask>=3.0.3",
    "idna>=2.0.0",
    "jsonify>=0.5",
    "pyopenssl>=19.1.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.4",
    "slack-sdk>=3.36.0",
    "urllib3<2.0.0",
]
