name: 'main'
'on':
  push:
    branches: [ main ]

jobs:
  setup:
    runs-on: [ self-hosted, runner-controller ]
    outputs:
      runner_name: ${{ steps.start_runner.outputs.runner_name }}
    steps:
    - id: start_runner
      env:
        WORKER_TYPE: base
      run: start-runner

  main:
    needs: [ setup ]
    runs-on: ${{ needs.setup.outputs.runner_name }}
    env:
      BUILDAH_FORMAT: docker
      BUILD_TYPE: docker
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NOTION_KEY: ${{ secrets.NOTION_KEY }}
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      REFERENCE_FILE_PATH: ${{ secrets.REFERENCE_FILE_PATH }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      ADX_CLUSTER_URI: ${{ secrets.ADX_CLUSTER_URI }}
      ADX_API_ENDPOINT: ${{ secrets.ADX_API_ENDPOINT }}
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup environment variables
      run: |
        echo "Environment variables configured at job level"

    - id: flags
      name: setup flags
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        msgContains() {
          echo "$COMMIT_MSG" | head -n 1 | grep -q "$1" && echo true || echo ""
        }
        echo d2p=$(msgContains '#deploy-to-prod') >> $GITHUB_OUTPUT
        echo no_build=$(msgContains '#no_build') >> $GITHUB_OUTPUT
        echo canary=$(msgContains '#canary') >> $GITHUB_OUTPUT

    - name: build image
      if: ${{ !steps.flags.outputs.no_build }}
      env:
        BUILDCTL_DEBUG: 'true'
      run: |
        echo "Building with environment variables:"
        echo "ANTHROPIC_API_KEY exists: $([[ -n "$ANTHROPIC_API_KEY" ]] && echo "YES" || echo "NO")"
        buildctl image

    - name: deploy image (prod)
      if: ${{ steps.flags.outputs.d2p }}
      run: buildctl deploy prod

  teardown:
    needs: [ setup, main ]
    if: always()
    runs-on: [ self-hosted, runner-controller ]
    steps:
    - name: teardown runner
      run: stop-runner ${{ needs.setup.outputs.runner_name }}